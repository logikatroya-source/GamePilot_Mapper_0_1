name: Build EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_DIR: GamePilot_Mapper_0_1_reviewed/GamePilot_Mapper_0_1

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name GamePilotMapper
          --collect-all PySide6 --collect-all pyautogui --collect-all cv2
          --add-data "assets;assets"
          main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamePilotMapper-windows
          path: ${{ env.APP_DIR }}/dist/GamePilotMapper.exe

      - name: Attach EXE to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_DIR }}/dist/GamePilotMapper.exe
